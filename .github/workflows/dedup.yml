name: Draw regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/dedup.js && node --check js/gossip.js && node --check gossip-service/news-id.js && node --check gossip-service/worker.js && node --check js/app.js && node --check js/horoscope-advice.js && node --check js/data.js && node --check js/sky-engine-adapter.js && node --check sw.js && node --check scripts/update-sky-engine.mjs
      - run: node --test tests/*.test.cjs
  picture-browser:
    # Playwright 1.57 supports Ubuntu 24.04, not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/picture-layout.browser.py
      - run: python tests/picture-production.browser.py
      - run: python tests/card-focus.browser.py
      - run: python tests/pwa-navigation.browser.py
