<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>此时，还有 · Now, and More</title>
<meta name="description" content="时间是确定的，下一块是什么，不确定。A precise clock, and below it, something random every minute.">
<script>
  /* Apply a manually chosen theme before first paint (no flash). */
  (function () {
    try {
      var t = localStorage.getItem("nam-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable: fall back to system preference */ }
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@100;300;400&display=swap" rel="stylesheet">
</head>
<body data-clock-style="paper">
<div id="glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="seal" aria-hidden="true">时</span>
    <span class="brand-text">
      <strong id="brand-title">此时，还有</strong>
      <small id="brand-subtitle">Now, and More</small>
    </span>
  </div>
  <div class="settings">
    <button id="settings-btn" type="button" aria-label="设置" aria-expanded="false" aria-controls="settings-panel">⚙</button>
    <div id="settings-panel" class="settings-panel" role="group" aria-label="设置" hidden>
      <div class="setting-row">
        <span id="lang-label" class="setting-label">语言</span>
        <div class="lang-segment" role="group" aria-label="Language">
          <button id="lang-zh" type="button" class="seg-btn">中文</button>
          <button id="lang-en" type="button" class="seg-btn">EN</button>
        </div>
      </div>
      <div class="setting-row">
        <span id="theme-label" class="setting-label">外观</span>
        <div class="lang-segment" role="group" aria-label="Appearance">
          <button id="theme-auto" type="button" class="seg-btn">跟随系统</button>
          <button id="theme-light" type="button" class="seg-btn">浅色</button>
          <button id="theme-dark" type="button" class="seg-btn">深色</button>
        </div>
      </div>
      <div class="setting-row">
        <span id="style-label" class="setting-label">时钟样式</span>
        <div id="style-chips" class="style-chips"></div>
      </div>
      <div class="setting-row">
        <span id="sign-label" class="setting-label">我的星座</span>
        <select id="sign-select" class="sign-select" aria-label="Zodiac sign / 星座"></select>
      </div>
    </div>
  </div>
</header>

<main class="stage">
  <p id="tagline" class="tagline">时间是确定的，下一块是什么，不确定。</p>
  <p id="date-line" class="date-line"></p>

  <!-- Paper / minimal digital clock -->
  <div id="clock-digital" class="clock clock-digital" aria-label="Current time">
    <span id="dig-h">00</span><span class="colon">:</span><span id="dig-m">00</span><span class="colon">:</span><span id="dig-s">00</span>
  </div>

  <!-- Analog clock -->
  <div id="clock-analog" class="clock clock-analog" hidden>
    <svg viewBox="0 0 200 200" role="img" aria-label="Analog clock">
      <circle cx="100" cy="100" r="96" class="dial-face"/>
      <g id="dial-ticks"></g>
      <line id="hand-hour" x1="100" y1="100" x2="100" y2="55" class="hand hand-hour"/>
      <line id="hand-minute" x1="100" y1="100" x2="100" y2="32" class="hand hand-minute"/>
      <line id="hand-second" x1="100" y1="112" x2="100" y2="26" class="hand hand-second"/>
      <circle cx="100" cy="100" r="4" class="dial-pin"/>
    </svg>
    <div id="analog-readout" class="analog-readout">00:00:00</div>
  </div>

  <!-- Flip clock -->
  <div id="clock-flip" class="clock clock-flip" hidden>
    <div class="flip-group"><div class="flip-card" id="flip-h">00</div></div>
    <span class="flip-sep">:</span>
    <div class="flip-group"><div class="flip-card" id="flip-m">00</div></div>
    <span class="flip-sep">:</span>
    <div class="flip-group"><div class="flip-card" id="flip-s">00</div></div>
  </div>

  <!-- Vertical clock -->
  <div id="clock-vertical" class="clock clock-vertical" hidden>
    <div id="vertical-time" class="vertical-time"></div>
  </div>

  <div class="progress-track" aria-hidden="true"><div id="minute-progress"></div></div>

  <!-- Random stage card -->
  <section id="card" class="card" tabindex="0" role="button" aria-live="polite">
    <div class="card-head">
      <span id="card-category" class="card-category"></span>
      <span id="card-meta" class="card-meta"></span>
    </div>
    <div id="card-body" class="card-body"></div>
  </section>

  <div class="controls">
    <button id="draw-btn" type="button">再抽一张</button>
    <span id="encounter" class="encounter"></span>
  </div>
  <p id="hint" class="hint">点卡片、按空格，或等下一分钟</p>
</main>

<footer class="footer">
  <span id="second-random" class="second-random" title="每秒一个新随机数 / A new random number every second"></span>
  <span class="footer-note">Now, and More · 此时，还有</span>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
