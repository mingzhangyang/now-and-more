<script>
  /* Apply a manually chosen theme before first paint (no flash). */
  (function () {
    try {
      var t = localStorage.getItem("nam-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable: fall back to system preference */ }
  })();
</script>
<link rel="stylesheet" href="css/style.css?v=57">
<!-- The serif Latin slice carries the clock's digits: fetch it early so
     the first frames are not drawn in a fallback face whose narrower
     "1" leaves gaps in the fixed digit cells. -->
<link rel="preload" href="assets/fonts/H4chBXePl9DZ0Xe7gG9cyOj7oqP0dTpxZbB9E9gjjmzKvaeKHUTtJDWv3z-us4bxD8F5og.119.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css?v=57">

<body data-clock-style="paper">
<div id="glow" aria-hidden="true"></div>
<div id="moon-glow" aria-hidden="true"></div>
<canvas id="fx-canvas" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand">
    <span class="seal" aria-hidden="true">时</span>
    <span class="brand-text">
      <strong id="brand-title">此时，还有</strong>
      <small id="brand-subtitle">Now, and More</small>
    </span>
  </div>
  <div class="settings">
    <button id="settings-btn" type="button" aria-label="设置" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7.5h8.5M17.5 7.5H20M4 16.5h2.5M11.5 16.5H20"/><circle cx="15" cy="7.5" r="2.5"/><circle cx="9" cy="16.5" r="2.5"/></svg></button>
    <div id="settings-panel" class="settings-panel" role="group" aria-label="设置" hidden>
      <div class="setting-row">
        <span id="lang-label" class="setting-label">语言</span>
        <div class="lang-segment" role="group" aria-label="Language">
          <button id="lang-zh" type="button" class="seg-btn">中文</button>
          <button id="lang-en" type="button" class="seg-btn">EN</button>
        </div>
      </div>
      <div class="setting-row">
        <span id="theme-label" class="setting-label">外观</span>
        <div class="lang-segment" role="group" aria-label="Appearance">
          <button id="theme-auto" type="button" class="seg-btn">跟随系统</button>
          <button id="theme-light" type="button" class="seg-btn">浅色</button>
          <button id="theme-dark" type="button" class="seg-btn">深色</button>
        </div>
      </div>
      <div class="setting-row">
        <span id="style-label" class="setting-label">时钟样式</span>
        <div id="style-chips" class="style-chips"></div>
      </div>
      <div class="setting-row">
        <span id="sign-label" class="setting-label">我的星座</span>
        <select id="sign-select" class="sign-select" aria-label="Zodiac sign / 星座"></select>
      </div>
      <div class="setting-row">
        <span id="ambient-label" class="setting-label">氛围模式</span>
        <div>
          <button id="ambient-btn" type="button" class="ambient-btn">进入</button>
        </div>
      </div>
      <div class="setting-row">
        <span id="fx-label" class="setting-label">特效</span>
        <div class="lang-segment" role="group" aria-label="Effects">
          <button id="fx-on" type="button" class="seg-btn">开</button>
          <button id="fx-off" type="button" class="seg-btn">关</button>
        </div>
      </div>
      <div class="setting-row">
        <button id="mydays-open" type="button" class="panel-page-link panel-page-btn"><span id="mydays-label">我的日子</span><span class="panel-page-arrow" aria-hidden="true">›</span></button>
      </div>
      <div class="setting-row">
        <a id="notes-link" class="panel-page-link" href="library.html"><span id="notes-label">我的库</span><span class="panel-page-arrow" aria-hidden="true">›</span></a>
      </div>
      <div class="panel-footer">
        <a id="privacy-link" href="privacy.html">隐私政策</a>
        <span class="panel-footer-sep" aria-hidden="true">·</span>
        <a id="about-link" href="about.html">关于</a>
      </div>
    </div>
  </div>
</header>

<!-- Gift notice: appears once, with the day's gifted postcard -->
<div id="gift-notice" class="gift-notice" role="status" hidden>
  <span id="gift-notice-text" class="gift-notice-text"></span>
  <button id="gift-notice-close" type="button" class="gift-notice-close" aria-label="关闭">×</button>
</div>

<div id="ambient-hint" class="ambient-hint" role="button" aria-hidden="true">Esc 退出氛围模式</div>

<main class="stage">
  <p id="tagline" class="tagline">时间是确定的，下一块是什么，不确定。</p>
  <p id="date-line" class="date-line"></p>

  <!-- Paper / minimal digital clock -->
  <div id="clock-digital" class="clock clock-digital" aria-label="Current time">
    <span id="dig-h">00</span><span class="colon">:</span><span id="dig-m">00</span><span class="colon">:</span><span id="dig-s">00</span>
  </div>

  <!-- Analog clock -->
  <div id="clock-analog" class="clock clock-analog" hidden>
    <svg viewBox="0 0 200 200" role="img" aria-label="Analog clock">
      <circle cx="100" cy="100" r="96" class="dial-face"/>
      <g id="dial-ticks"></g>
      <line id="hand-hour" x1="100" y1="100" x2="100" y2="55" class="hand hand-hour"/>
      <line id="hand-minute" x1="100" y1="100" x2="100" y2="32" class="hand hand-minute"/>
      <line id="hand-second" x1="100" y1="112" x2="100" y2="26" class="hand hand-second"/>
      <circle cx="100" cy="100" r="4" class="dial-pin"/>
    </svg>
    <div id="analog-readout" class="analog-readout"><span class="ro-u" id="ro-h">00</span><span class="ro-c">:</span><span class="ro-u" id="ro-m">00</span><span class="ro-c">:</span><span class="ro-u" id="ro-s">00</span></div>
  </div>

  <!-- Flip clock -->
  <div id="clock-flip" class="clock clock-flip" hidden>
    <div class="flip-group"><div class="flip-card" id="flip-h">00</div></div>
    <span class="flip-sep">:</span>
    <div class="flip-group"><div class="flip-card" id="flip-m">00</div></div>
    <span class="flip-sep">:</span>
    <div class="flip-group"><div class="flip-card" id="flip-s">00</div></div>
  </div>

  <!-- Vertical clock -->
  <div id="clock-vertical" class="clock clock-vertical" hidden>
    <div id="vertical-time" class="vertical-time"></div>
  </div>

  <div class="progress-track" aria-hidden="true"><div id="minute-progress"></div></div>

  <!-- Random stage card -->
  <section id="card" class="card" tabindex="0" role="button" aria-live="polite">
    <div class="card-head">
      <span id="card-category" class="card-category"></span>
      <span id="card-meta" class="card-meta"></span>
    </div>
    <div id="card-body" class="card-body"></div>
    <!-- A classics excerpt whose complete passage is on file gets a
         quiet door to the full text here. The button lives outside
         #card-body, so the keepsake keeps capturing the excerpt only. -->
    <div id="card-foot" class="card-foot" hidden>
      <button id="full-text-btn" type="button" class="full-text-btn">全文 ›</button>
    </div>
  </section>

  <div class="controls">
    <button id="draw-btn" type="button">再抽一张</button>
    <button id="capture-btn" type="button">留影</button>
    <span id="encounter" class="encounter"></span>
  </div>
  <p id="hint" class="hint">点卡片、按空格，或等下一分钟</p>
</main>

<footer class="footer">
  <span id="second-random" class="second-random" title="每秒一个新随机数 / A new random number every second"></span>
  <span class="footer-note">Now, and More · 此时，还有</span>
</footer>

<!-- Add-a-note: a small floating button, revealed only near the
     bottom-right corner (hover on desktop, swipe-up on touch, or focus).
     The library page (library.html, linked from the settings panel)
     carries a permanent entry too. -->
<button id="note-fab" type="button" aria-label="写一句">＋ 写一句</button>

<!-- Write-a-note modal -->
<div id="note-overlay" class="capture-overlay" hidden>
  <div class="capture-dialog note-dialog" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div id="note-title" class="capture-title">写一句</div>
    <div class="lang-segment" role="group" aria-label="Type">
      <button id="note-type-reflection" type="button" class="seg-btn active">心得</button>
      <button id="note-type-memo" type="button" class="seg-btn">备忘</button>
    </div>
    <textarea id="note-text" class="note-text-input" rows="4" placeholder="写下此刻的一句话…"></textarea>
    <div class="note-count"><span id="note-count-num">0</span>/120</div>
    <label class="note-date-row">
      <span id="note-date-label">选个日子（可选）</span>
      <input id="note-date" type="date">
    </label>
    <p id="note-date-hint" class="note-hint">选了日子，这句话会在那天送达</p>
    <p id="note-error" class="note-error" hidden>这台设备存不下</p>
    <div class="capture-actions">
      <button id="note-save" type="button" class="capture-action" disabled>保存</button>
      <button id="note-cancel" type="button" class="capture-action">取消</button>
    </div>
  </div>
</div>

<!-- My days modal: the saved days and the add form live here — the
     settings panel keeps only a door to it, like My Notes. -->
<div id="mydays-overlay" class="capture-overlay" hidden>
  <div class="capture-dialog mydays-dialog" role="dialog" aria-modal="true" aria-labelledby="mydays-title">
    <div id="mydays-title" class="capture-title">我的日子</div>
    <div id="my-days-list" class="my-days-list"></div>
    <p id="mydays-empty" class="mydays-empty">还没有定下什么日子</p>
    <div class="myday-form">
      <input id="myday-name" class="myday-name" type="text" maxlength="24" placeholder="名字，如：妈妈生日" autocomplete="off">
      <div class="myday-line">
        <select id="myday-month" class="sign-select" aria-label="月 / Month"></select>
        <select id="myday-day" class="sign-select" aria-label="日 / Day"></select>
      </div>
      <div class="lang-segment" role="group" aria-label="Calendar">
        <button id="myday-cal-solar" type="button" class="seg-btn">公历</button>
        <button id="myday-cal-lunar" type="button" class="seg-btn">农历</button>
      </div>
      <div class="myday-line">
        <select id="myday-effect" class="sign-select" aria-label="效果 / Effect"></select>
        <button id="myday-add" type="button" class="ambient-btn">添加</button>
      </div>
    </div>
    <div class="capture-actions">
      <button id="mydays-close" type="button" class="capture-action">关闭</button>
    </div>
  </div>
</div>

<!-- Full-text reading modal: the complete passage behind a classics
     card's excerpt. Pure reading — opening it touches no draw state. -->
<div id="full-overlay" class="capture-overlay full-overlay" hidden>
  <div class="capture-dialog full-dialog" role="dialog" aria-modal="true" aria-labelledby="full-cat">
    <button id="full-close" type="button" class="full-close" aria-label="关闭">×</button>
    <div id="full-cat" class="full-cat">国学经典</div>
    <div id="full-body" class="full-body"></div>
    <div id="full-source" class="full-source"></div>
  </div>
</div>

<!-- Transparent lightbox: preview and save the same composed PNG. -->
<div id="img-overlay" class="capture-overlay img-overlay" hidden>
  <div class="capture-dialog img-dialog" role="dialog" aria-modal="true" aria-labelledby="img-cat">
    <section id="img-card" class="card img-card">
      <div class="card-head">
        <span id="img-cat" class="card-category"></span>
        <span id="img-meta" class="card-meta"></span>
      </div>
      <div id="img-body" class="card-body"></div>
    </section>
    <div class="capture-actions">
      <button id="img-capture-btn" type="button" class="capture-action" disabled>保存图片</button>
      <button id="img-close-btn" type="button" class="capture-action">关闭</button>
    </div>
  </div>
</div>

<!-- Keepsake capture result: the frozen moment as a shareable PNG -->
<div id="capture-overlay" class="capture-overlay" hidden>
  <div class="capture-dialog" role="dialog" aria-modal="true" aria-labelledby="capture-title">
    <div id="capture-title" class="capture-title">留影</div>
    <img id="capture-img" class="capture-img" alt="">
    <div class="capture-actions">
      <a id="capture-download" class="capture-action" href="#" download>保存图片</a>
      <button id="capture-share" type="button" class="capture-action" hidden>分享</button>
      <button id="capture-close-btn" type="button" class="capture-action">关闭</button>
    </div>
  </div>
</div>
